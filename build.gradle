plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.21.1-1.2.0'
group = 'com.wynprice.secretrooms'
base.archivesName = 'secretrooms'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.259'
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', 'secretroomsmod', '--all',
                '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }
    mods {
        secretroomsmod { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.secretroomsmod
    }
}

repositories { mavenCentral() }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
    testImplementation 'net.neoforged:testframework:21.1.259'
}
test { useJUnitPlatform() }

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '**/.cache/**'
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
jar {
    manifest.attributes 'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'Wyn Price'
}
publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
    repositories { maven { url = layout.buildDirectory.dir('repo') } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
